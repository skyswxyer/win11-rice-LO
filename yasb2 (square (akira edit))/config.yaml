# yaml-language-server: $schema=https://raw.githubusercontent.com/amnweb/yasb/main/schema.json

watch_stylesheet: true
watch_config: true
debug: false
komorebi:
  start_command: 'komorebic start --config "C:\Users\Nyrn\.config\komorebi\komorebi.json" --whkd'
  stop_command: 'komorebic stop --whkd'
  reload_command: 'komorebic stop --whkd && komorebic start --config "C:\Users\Nyrn\.config\komorebi\komorebi.json" --whkd'
update_check: true
bars:
  primary-bar:
    enabled: true
    screens:
      - '*'
    class_name: yasb-bar
    alignment:
      position: top
      center: true
    animation:
      enabled: true
      duration: 300
    blur_effect:
      enabled: true
      acrylic: true
      round_corners: false
      # round_corners_type: small
      border_color: "None"
    window_flags:
      always_on_top: false
      windows_app_bar: true
      hide_on_fullscreen: true
    dimensions:
      width: 100%
      height: 28
    padding:
      top: 0
      left: 0
      bottom: -1
      right: 0
    widgets:
      left: 
        - quick_launch
        - komorebi_workspaces
        - komorebi_active_layout
        - taskbar
      center:
        - clock
        - open-meteo
      right:
        - cava
        - media
        - cpu
        - gpu
        - memory
        - volume
        - systray
        - wallpapers
        - notifications
        - power_menu
widgets:

  quick_launch:
    type: yasb.quick_launch.QuickLaunchWidget
    options:
      label: "<span>\ue8e5</span>"
      search_placeholder: Search applications...
      max_results: 30
      show_icons: true
      icon_size: 32
      home_page: false
      providers:
        apps:
          enabled: true
          prefix: '*'
          priority: 0
          show_recent: true
          max_recent: 5
          show_description: true
        color:
          enabled: true
          prefix: "c:"
          priority: 1
        file_search:
          enabled: true
          prefix: "/"
          priority: 2
          backend: "auto"
          show_path: true
      popup:
        width: 650
        height: 400
        blur: true
        round_corners: true
        round_corners_type: small
        border_color: "system"
        dark_mode: true
      callbacks:
        on_left: toggle_quick_launch
      keybindings:
      - keys: alt+space
        action: toggle_quick_launch
        screen: active

  komorebi_workspaces:
    type: "komorebi.workspaces.WorkspaceWidget"
    options:
      label_offline: "Komorebi Offline"
      label_workspace_btn: "{index}"
      label_workspace_active_btn: "{index}"
      label_workspace_populated_btn: "{index}"
      label_default_name: ""
      label_zero_index: false
      hide_empty_workspaces: true
      hide_if_offline: false
      toggle_workspace_layer:
        enabled: false
        tiling_label: "Tiling"
        floating_label: "Floating"
      app_icons: 
        enabled_populated: false
        enabled_active: false
        size: 12
        max_icons: 0
        hide_label: false
        hide_duplicates: false
        hide_floating: false

  komorebi_active_layout:
    type: "komorebi.active_layout.ActiveLayoutWidget"
    options:
      hide_if_offline: true
      label: "{layout_name}"
      layouts: ['bsp', 'columns', 'rows', 'grid', 'vertical_stack', 'horizontal_stack', 'ultrawide_vertical_stack','right_main_vertical_stack']
      layout_icons:
        bsp: "\uebeb"
        columns: "\uebf7"
        rows: "\uec01"
        grid: "\udb81\udf58"
        scrolling: "\uebf7"
        vertical_stack: "\uebee"
        horizontal_stack: "\uebf0"
        ultrawide_vertical_stack: "\uebee"
        right_main_vertical_stack: "\uebf1"
        monocle: "\uf06f"
        maximized: "\uf06f"
        floating: "\uf2d2"
        paused: "\udb83\udf89"
        tiling: "\udb81\ude40"
      callbacks:
        on_left: 'toggle_layout_menu'
        on_middle: 'next_layout'
        on_right: 'prev_layout'
      layout_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "left"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_layout_icons: true

  taskbar:
    type: "yasb.taskbar.TaskbarWidget"
    options:
      icon_size: 16
      tooltip: true
      show_only_visible: false
      strict_filtering: true
      monitor_exclusive: false
      animation:
        enabled: true
        duration: 100
      preview:
        enabled: true
        width: 340
        delay: 400
        padding: 6
        margin: 6
      title_label:
        enabled: true
        show: "focused"
        min_length: 10
        max_length: 24
      ignore_apps:
        processes: []
        titles: []
        classes: []

  clock:
      type: "yasb.clock.ClockWidget"
      options:
        label: "{%A, %b %d %H:%M}"
        label_alt: "{%A %d, %B %Y %H:%M}"
        timezones: []
        calendar:
          blur: true
          round_corners: true
          alignment: "center"
          direction: "down"
          offset_top: 6
          offset_left: 0
          extended: false
          show_years: true
          show_holidays: true
          show_week_numbers: true
          country_code: "KZ"
          holiday_color: "#FF6464"
      callbacks:
        on_left: toggle_calendar
        on_middle: "next_timezone"
        on_right: toggle_label

  open-meteo:
    type: yasb.open_meteo.OpenMeteoWidget
    options:
      label: "<span>{icon}</span> {temp}"
      label_alt: '{location}: Min {min_temp}, Max {max_temp}, Humidity {humidity}'
      tooltip: true
      update_interval: 600
      hide_decimal: true
      units: metric
      callbacks:
        on_left: toggle_card
        on_middle: do_nothing
        on_right: toggle_label
      icons:
        sunnyDay: "\ue30d"
        clearNight: "\ue32b"
        cloudyDay: "\ue312"
        cloudyNight: "\ue311"
        rainyDay: "\ue308"
        rainyNight: "\ue333"
        foggyDay: "\ue303"
        foggyNight: "\ue346"
        thunderstormDay: "\ue30f"
        thunderstormNight: "\ue338"
        default: "\uebaa"
      weather_card:
        blur: false
        round_corners: true
        round_corners_type: normal
        border_color: system
        alignment: center
        direction: down
        offset_top: 6
        offset_left: 0
        icon_size: 32
        show_hourly_forecast: true
        time_format: 24h
        hourly_point_spacing: 76
        hourly_icon_size: 16
        icon_smoothing: true
        temp_line_width: 2
        current_line_color: '#8EAEE8'
        current_line_width: 1
        current_line_style: dot
        hourly_gradient:
          enabled: false
          top_color: "#8EAEE8"
          bottom_color: "#2A3E68"
        hourly_forecast_buttons:
          enabled: true
          default_view: "temperature"
          temperature_icon: "\udb81\udd99"
          rain_icon: "\udb81\udd96"
          snow_icon: "\udb81\udd98"
        weather_animation:
          enabled: true
          snow_overrides_rain: true
          temp_line_animation_style: both
          rain_effect_intensity: 0.5
          snow_effect_intensity: 0.5
          scale_with_chance: true

  cava:
    type: "yasb.cava.CavaWidget"
    options:
      bar_height: 12
      min_bar_height: 1
      gradient: 0
      reverse: 1
      foreground: "#7d98f0"
      bars_number: 18
      bar_spacing: 0
      bar_width: 6
      noise_reduction: 50
      sleep_timer: 2
      hide_empty: false

  media:
    type: "yasb.media.MediaWidget"
    options:
      label: "{title}{s}{artist}"
      label_alt: "{title}{s}{artist}"
      separator: " - "
      hide_empty: true
      callbacks:
        on_left: "toggle_media_menu"
        on_middle: "do_nothing"
        on_right: "do_nothing"
      max_field_size:
        label: 45
        label_alt: 30
      show_thumbnail: false
      controls_only: false
      controls_left: true
      controls_hide: true
      thumbnail_alpha: 80
      thumbnail_padding: 8
      thumbnail_corner_radius: 16
      icons:
        prev_track: "\ue892"
        next_track: "\ue893"
        play: "\ue768"
        pause: "\ue769"
      media_menu:
        blur: false
        round_corners: false
        round_corners_type: normal
        border_color: system
        alignment: right
        direction: down
        offset_top: 6
        offset_left: 0
        thumbnail_corner_radius: 0
        thumbnail_size: 120
        max_title_size: 60
        max_artist_size: 50
        show_source: true
      media_menu_icons:
        play: "\udb81\udc0a"
        pause: "\udb80\udfe4"
        prev_track: "\udb81\udcae"
        next_track: "\udb81\udcad"
      scrolling_label:
        enabled: false
        update_interval_ms: 33
        style: "left"  # can be "left", "right", "bounce", "bounce-ease"
        separator: " | "
        label_padding: 0
        always_scroll: false
      # Easing curve params: https://www.desmos.com/calculator/j7eamemxzi
        ease_slope: 20
        ease_pos: 0.8
        ease_min: 0.5
      progress_bar:
        enabled: false       # Whether to enable the progress bar on the widget.
        alignment: "bottom"  # The alignment of the progress bar inside the widget container. Can be "top", "bottom", or "center".

  cpu:
      type: yasb.cpu.CpuWidget
      options:
        label: "CPU"
        label_alt: "CPU: {info[percent][total]}%"
        update_interval: 2000
        hide_decimal: true
        progress_bar:
          progress_type: linear_vertical
          enabled: true
          position: "left"
          size: 14
          thickness: 3
          color: "#7d98f0"
          background_color: "transparent" 
        menu:
          enabled: true
          show_graph: true
          show_graph_grid: true
          graph_history_size: 60
          alignment: center
        callbacks:
          on_left: toggle_menu
          on_right: toggle_label

  memory:
    type: yasb.memory.MemoryWidget
    options:
      label: "RAM"
      label_alt: "RAM: {virtual_mem_used}/{virtual_mem_total}"
      update_interval: 5000
      hide_decimal: true
      progress_bar:
        progress_type: linear_vertical
        enabled: true
        position: "left"
        size: 14
        thickness: 3
        color: "#7d98f0"
        background_color: "transparent" 
      callbacks:
        on_left: toggle_menu
        on_middle: do_nothing
        on_right: toggle_label
      memory_thresholds:
        low: 25
        medium: 50
        high: 90
      histogram_icons:
      - "\u2581" # 0%
      - "\u2581" # 10%
      - "\u2582" # 20%
      - "\u2583" # 30%
      - "\u2584" # 40%
      - "\u2585" # 50%
      - "\u2586" # 60%
      - "\u2587" # 70%
      - "\u2588" # 80%+
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60

  gpu:
    type: "yasb.gpu.GpuWidget"
    options:
      label: "GPU"
      label_alt: "GPU: {info[temp]}°C | {info[utilization]}%"
      update_interval: 2000
      progress_bar:
        progress_type: linear_vertical
        enabled: true
        position: "left"
        size: 14
        thickness: 3
        color: "#7d98f0"
        background_color: "transparent" 
      gpu_thresholds:
        low: 25
        medium: 50
        high: 90
      histogram_icons:
        - "\u2581" # 0%
        - "\u2581" # 10%
        - "\u2582" # 20%
        - "\u2583" # 30%
        - "\u2584" # 40%
        - "\u2585" # 50%
        - "\u2586" # 60%
        - "\u2587" # 70%
        - "\u2588" # 80%+
      histogram_num_columns: 8
      callbacks:
        on_left: "toggle_menu"
        on_right: "toggle_label"
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60

  volume:
    type: yasb.volume.VolumeWidget
    options:
      label: "<span>{icon}</span> {level}"
      label_alt: "{level}"
      tooltip: true
      icons:
        "muted": "\ueee8" # Icon for muted
        "10": "\uf026"  # Icon for 0-10% volume
        "30": "\uf027"  # Icon for 11-30% volume
        "60": "\uf027"  # Icon for 31-60% volume
        "100": "\uf028" # Icon for 61-100% volume
      callbacks:
        on_left: toggle_volume_menu
        on_right: toggle_mute
      audio_menu:
        blur: false
        round_corners: true
        round_corners_type: normal
        border_color: system
        alignment: right
        direction: down
        offset_top: 6
        offset_left: 0
        show_apps: true
        show_app_labels: false
        show_app_icons: true
        show_apps_expanded: true
        app_icons:
          toggle_down: "\uf106"
          toggle_up: "\uf107"

  notifications:
    type: yasb.notifications.NotificationsWidget
    options:
      label: "<span>\ueaa2</span>"
      label_alt: '{count} notifications'
      hide_empty: false
      tooltip: false
      callbacks:
        on_left: toggle_notification
        on_right: do_nothing
        on_middle: do_nothing

  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      class_name: "systray"
      label_collapsed: "\uf40e"
      label_expanded: "\uf40e"
      label_position: "right" # Can be "left" or "right"
      icon_size: 16 # Can be any integer between 8 and 64
      pin_click_modifier: "alt" # Can be "ctrl", "alt" or "shift"
      show_unpinned: false
      show_unpinned_button: true
      show_battery: false
      show_in_popup: 1
      show_volume: false
      show_network: true
      use_hook: true
      icons_per_row: 3
      show_network: false
      use_hook: false # Whether to use the new systray hook instead of the legacy systray monitor
      hide_icons: [] # Optional, list of process names to hide (e.g. ["discord"])
      popup:
        blur: false
        round_corners: true
        round_corners_type: normal
        border_color: None
        alignment: center
        direction: down
        offset_top: 6
        offset_left: 0

  wallpapers:
    type: "yasb.wallpapers.WallpapersWidget"
    options:
      label: "<span>\udb83\ude09</span>"
    # Example path to folder with images. Can be a single string or a list of strings.
    # image_path: "C:\\Users\\{Username}\\Images" 
      image_path: 
        - "D:\\img\\Art\\WP"
      change_automatically: false
      update_interval: 60 # If change_automatically is true, update interval in seconds
      engine:
        enabled: true
        animation: "diamond" # circle/slide_top/diamond/split
      gallery:
        enabled: true
        blur: false
        image_width: 296
        image_per_page: 6
        gallery_columns: 0 # 0 = auto, matches image_per_page for a single row
        horizontal_position: "center" # left/center/right placement on screen
        vertical_position: "center" # top/center/bottom placement
        position_offset: 0 # minimum gap (px) from screen edges - see below for advanced options
        respect_work_area: true # clamp to OS work area (avoids Windows taskbar)
        show_buttons: true
        orientation: "portrait"
        image_spacing: 8
        lazy_load: true
        lazy_load_delay: 10
        lazy_load_fadein: 400
        image_corner_radius: 0
      callbacks:
        on_left: "toggle_gallery"
        on_middle: "do_nothing"
        on_right: "change_wallpaper"

  power_menu:
      type: yasb.power_menu.PowerMenuWidget
      options:
        label: "<span>\udb81\udc25</span>"
        uptime: true
        show_user: true
        blur: false
        blur_background: true
        animation_duration: 120 # Milliseconds
        button_row: 5 # Number of buttons in a row, min 1 max 6
        profile_image_size: 80 # Avatar size in pixels
        buttons:
          restart: ["\uead2", "Restart"]
          shutdown: ["\uf011", "Shut Down"]
          signout: ["\udb80\udf43", "Sign out"]
          lock: ["\uea75", "Lock"]
          cancel: ["\udb81\udf3a", "Cancel"]
          
    